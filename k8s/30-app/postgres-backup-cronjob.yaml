apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: task-app
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: postgres:14
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  BACKUP_FILE="/backups/task_app_$(date +%Y%m%d_%H%M%S).sql"
                  export PGPASSWORD="$POSTGRES_PASSWORD"

                  echo "Starting PostgreSQL backup..."

                  pg_dump \
                    -h postgres \
                    -U "$POSTGRES_USER" \
                    -d "$POSTGRES_DB" \
                    --no-password \
                    --format=plain \
                    > "$BACKUP_FILE"

                  test -s "$BACKUP_FILE"
                  echo "Backup created: $BACKUP_FILE"
                  ls -lh "$BACKUP_FILE"

                  echo "Removing backups older than 7 days..."
                  find /backups -maxdepth 1 -type f \
                    -name 'task_app_*.sql' -mtime +7 -delete

              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_PASSWORD
                - name: POSTGRES_DB
                  valueFrom:
                    configMapKeyRef:
                      name: task-app-config
                      key: DB_NAME

              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 300m
                  memory: 256Mi

              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL

              volumeMounts:
                - name: backups
                  mountPath: /backups

          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backup-data
