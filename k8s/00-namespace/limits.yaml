apiVersion: v1
kind: ResourceQuota
metadata:
  name: task-app-quota
  namespace: task-app
spec:
  hard:
    pods: "15"
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    persistentvolumeclaims: "3"
    requests.storage: 5Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: task-app-limits
  namespace: task-app
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      max:
        cpu: "2"
        memory: 2Gi
      min:
        cpu: 50m
        memory: 64Mi
